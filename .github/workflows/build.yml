name: Deploy Web App to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# গিটহাব পেজেস-এ ডিপ্লয় করার পারমিশন
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Web Project
        # নিচে 'your_file.zip' এর জায়গায় তোর আপলোড করা জিপ ফাইলের আসল নামটি দিবি
        run: |
          mkdir public
          unzip your_file.zip -d public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
